[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yxp-admin-api"
version = "0.1.0"
description = "YXP K12 knowledge platform - admin management API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "motor>=3.6",
  "mongomock-motor>=0.0.34",
  "PyJWT>=2.10",
  "argon2-cffi>=23.1",
  "structlog>=24.4",
  "httpx>=0.28",
  "pymupdf>=1.24",
  "celery>=5.4",
  "redis>=5.2",
  "minio>=7.2",
  "langgraph>=0.6",
]

[project.optional-dependencies]
milvus = ["pymilvus>=2.5"]
# Local BGE-M3 dense + sparse embeddings (`EMBEDDING_PROVIDER=bge_m3`).
embeddings = ["FlagEmbedding>=1.3", "torch>=2.4"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers>=4.8",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
]

[project.scripts]
yxp-seed = "app.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 excluded: the seed corpus and the copied permission matrix are line-oriented data.
# UP046/UP047 excluded: Pydantic models keep the explicit Generic[T] form.
ignore = ["B008", "E501", "UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
